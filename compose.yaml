name: nek
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nek-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
volumes:
  nek-data:
